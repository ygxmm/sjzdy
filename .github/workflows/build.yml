name: Build zdysj

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos + SDK
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: $HOME/theos
          key: theos-${{ runner.os }}-v1

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-v1

      - name: Setup Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDKs
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "$(ls $HOME/theos/sdks 2>/dev/null)" ]; then
            cd $HOME/theos/sdks
            curl -sL -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
            TMPDIR=$(mktemp -d)
            unzip -q sdks.zip -d "$TMPDIR"
            mv "$TMPDIR"/sdks-master/*.sdk "$HOME/theos/sdks/"
            rm -rf sdks.zip "$TMPDIR"
          fi
          ls $HOME/theos/sdks

      - name: Setup Env
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: zdysj-deb
          path: packages/*.deb
